name: Play Console & GitHub Release

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      rollback_version:
        description: 'Optional rollback version tag (e.g. v1.0.0)'
        required: false
        default: ''

concurrency:
  group: play-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare Release, Publish GitHub & Play Console
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.rollback_version }}" ]; then
            VERSION_NAME="${{ github.event.inputs.rollback_version }}"
            VERSION_CODE=$(date +'%Y%m%d%H')
          else
            MAJOR=$(grep -E 'val\s+major\s*=\s*[0-9]+' build.gradle.kts | head -1 | grep -o -E '[0-9]+')
            MINOR=$(grep -E 'val\s+minor\s*=\s*[0-9]+' build.gradle.kts | head -1 | grep -o -E '[0-9]+')
            PATCH=$(grep -E 'val\s+patch\s*=\s*[0-9]+' build.gradle.kts | head -1 | grep -o -E '[0-9]+')
            BUILD=$(grep -E 'val\s+build\s*=\s*[0-9]+' build.gradle.kts | head -1 | grep -o -E '[0-9]+')
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
            VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD ))
          fi
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          
          echo "versionName=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "shortSha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Create Dedicated Release Branch
        run: |
          BRANCH_NAME="release/void/${{ steps.version.outputs.versionName }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            echo "Release branch $BRANCH_NAME exists, checking out."
            git checkout "$BRANCH_NAME"
          else
            echo "Creating dedicated release branch $BRANCH_NAME for safe rollback tracking."
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
          fi

      - name: Build Android Release Artifacts (APK & AAB)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          fi

      - name: Generate Release Notes
        run: |
          mkdir -p release_notes/en-US
          cat > release_notes/en-US/default.txt <<EOF
          Source:
          branch=release/void/${{ steps.version.outputs.versionName }}
          commit=${{ github.sha }}
          workflow=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.versionName }}
          name: "VOID Launcher v${{ steps.version.outputs.versionName }}"
          body: |
            ### Release Summary
            - **App:** VOID Launcher
            - **Version:** v${{ steps.version.outputs.versionName }}
            - **Commit:** ${{ github.sha }}
            - **Release Branch:** `release/void/${{ steps.version.outputs.versionName }}`
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/release/*.apk
            build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Google Play (Internal Track)
        if: env.PLAY_CONSOLE_JSON != ''
        env:
          PLAY_CONSOLE_JSON: ${{ secrets.PLAY_CONSOLE_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_JSON }}
          packageName: com.knownassurajit.app.launcher.voidlauncher
          releaseFiles: build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          whatsNewDirectory: release_notes
          releaseName: void-${{ steps.version.outputs.versionName }}-${{ steps.version.outputs.shortSha }}
