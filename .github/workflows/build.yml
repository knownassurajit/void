name: Android CI/CD Pipeline

on:
  push:
    branches: [ master, stage, develop ]

jobs:

  # ─────────────────────────────────────────────
  # DEVELOP — Unit tests + Lint
  # ─────────────────────────────────────────────
  build-develop:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Lint Analysis
        run: ./gradlew lintDebug

      - name: Upload Test & Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: develop-reports
          path: "**/build/reports/"
          retention-days: 14

      - name: Document Develop Tests
        if: always()
        run: |
          echo "## Develop Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Single-variant OSS build: unit tests + lint" >> $GITHUB_STEP_SUMMARY
          echo "Reports are available in the artifacts." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # STAGE — Debug build → GitHub Pre-release
  # ─────────────────────────────────────────────
  build-stage:
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stage-build
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Extract Version from Gradle
        id: version
        run: |
          GRADLE_FILE=$(find . -maxdepth 3 -name "build.gradle.kts" ! -path "./build/*" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find . -maxdepth 3 -name "build.gradle" ! -path "./build/*" | head -n 1)
          fi
          VERSION=""
          if grep -q -E 'val\s+major\s*=\s*[0-9]+' "$GRADLE_FILE"; then
            MAJOR=$(grep -E 'val\s+major\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            MINOR=$(grep -E 'val\s+minor\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            PATCH=$(grep -E 'val\s+patch\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            BUILD=$(grep -E 'val\s+build\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            VERSION="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(date +'%Y.%m.%d')
          fi
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline -20 --pretty="- %s (%h)")
          else
            LOG=$(git log --pretty="- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Rename APK
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.app_version }}"
          APK=$(find . -path "*/apk/debug/*.apk" | head -n 1)
          NEW_NAME="void-stage-v${VERSION}.apk"
          mv "$APK" "${NEW_NAME}"
          echo "apk=${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Extract Timestamp
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

      - name: Create Pre-release and Upload APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.rename.outputs.apk }}
          tag_name: stage-v${{ steps.version.outputs.app_version }}-${{ github.run_number }}
          name: "Void Launcher v${{ steps.version.outputs.app_version }} (Stage #${{ github.run_number }})"
          body: |
            **Debug build for internal testing** (single-variant OSS)

            **Build generated on:** ${{ steps.timestamp.outputs.time }}
            **Run Number:** #${{ github.run_number }}

            ### Build
            - `void-stage-v${{ steps.version.outputs.app_version }}.apk` — full feature set (AI, widgets, Private Space, notes)

            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # MASTER — Signed Release → GitHub Stable Release
  # ─────────────────────────────────────────────
  build-master:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Lint Analysis
        run: ./gradlew lintDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Find Release Build Directories
        id: locate
        run: |
          APK_DIR=$(dirname "$(find . -path "*/apk/release/*.apk" | head -n 1)")
          AAB_DIR=$(dirname "$(find . -path "*/bundle/release/*.aab" | head -n 1)")
          echo "apk_dir=$APK_DIR" >> $GITHUB_OUTPUT
          echo "aab_dir=$AAB_DIR" >> $GITHUB_OUTPUT

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: ${{ steps.locate.outputs.apk_dir }}
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Sign Release AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: ${{ steps.locate.outputs.aab_dir }}
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Extract Version from Gradle
        id: version
        run: |
          GRADLE_FILE=$(find . -maxdepth 3 -name "build.gradle.kts" ! -path "./build/*" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find . -maxdepth 3 -name "build.gradle" ! -path "./build/*" | head -n 1)
          fi
          VERSION=""
          if grep -q -E 'val\s+major\s*=\s*[0-9]+' "$GRADLE_FILE"; then
            MAJOR=$(grep -E 'val\s+major\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            MINOR=$(grep -E 'val\s+minor\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            PATCH=$(grep -E 'val\s+patch\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            BUILD=$(grep -E 'val\s+build\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            VERSION="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(date +'%Y.%m.%d')
          fi
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline -20 --pretty="- %s (%h)")
          else
            LOG=$(git log --pretty="- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Rename Builds
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.app_version }}"
          APK="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          NEW_APK="void-release-v${VERSION}.apk"
          mv "$APK" "${NEW_APK}"
          echo "apk=${NEW_APK}" >> $GITHUB_OUTPUT
          AAB="${{ steps.sign_aab.outputs.signedReleaseFile }}"
          NEW_AAB="void-release-v${VERSION}.aab"
          mv "$AAB" "${NEW_AAB}"
          echo "aab=${NEW_AAB}" >> $GITHUB_OUTPUT

      - name: Upload Builds to Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: void-release-builds-v${{ steps.version.outputs.app_version }}
          path: |
            ${{ steps.rename.outputs.apk }}
            ${{ steps.rename.outputs.aab }}
          retention-days: 90

      - name: Extract Timestamp
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

      - name: Create Stable Release and Upload Builds
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.rename.outputs.apk }}
            ${{ steps.rename.outputs.aab }}
          tag_name: v${{ steps.version.outputs.app_version }}+${{ github.run_number }}
          name: "Void Launcher v${{ steps.version.outputs.app_version }} (Stable Release)"
          body: |
            **Production Release `v${{ steps.version.outputs.app_version }}`** (single-variant OSS)

            **Build generated on:** ${{ steps.timestamp.outputs.time }}
            **Run Number:** #${{ github.run_number }}

            ### Builds
            - `void-release-v${{ steps.version.outputs.app_version }}.apk` — sideload install
            - `void-release-v${{ steps.version.outputs.app_version }}.aab` — optional distribution bundle

            Full features included: ML Kit GenAI summaries, AppWidgetHost widgets, Private Space, notes.

            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Installation
            Enable **Install from unknown sources** when sideloading the APK.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
